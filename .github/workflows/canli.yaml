name: build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 10 - TV
        run: python bot.py

      - name: Commit
        run: |
          git config --global user.name "【entity-github¦canonical_name=github】-actions"
          git config --global user.email "actions@【entity-github¦canonical_name=github】.com"
          git add ulusal.m3u
          git commit -m "m3u guncellendi" || echo "degisiklik yok"
          git push
