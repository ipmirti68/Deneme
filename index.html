:root{
  --bg:#071433;
  --surface:#0d2450;
  --surface-2:#122c5c;
  --card:#f7f5ec;
  --card-2:#ffffff;
  --ink:#0a1730;
  --muted:#66708a;
  --line:#d8d5c7;
  --yellow:#ffc400;
  --yellow-2:#ffe066;
  --blue:#1a49a8;
  --safe-area-inset-top: 0px;
}

*{
  box-sizing:border-box
}

html{
  background:var(--bg)
}

body{
  margin:0;
  color:var(--ink);
  font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;
  background:var(--bg)
}

button,input,select{
  font:inherit
}

button{
  cursor:pointer
}

button:focus-visible,input:focus-visible,select:focus-visible{
  outline:3px solid var(--yellow);
  outline-offset:2px
}

.app-shell{
  min-height:100vh;
  padding-top:var(--safe-area-inset-top);
  background:#071433;
  overflow-x:clip
}

.topbar{
  max-width:1280px;
  margin:0 auto;
  padding:18px 24px 8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  color:#fff
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
  min-width:0
}

.mark{
  width:48px;
  height:48px;
  flex:0 0 48px;
  background:var(--yellow);
  color:#071433;
  display:grid;
  place-items:center;
  border-radius:13px;
  font-weight:900;
  position:relative;
  overflow:hidden
}

.mark span{
  font-size:20px;
  position:relative;
  z-index:1
}

.mark i{
  position:absolute;
  width:90px;
  height:90px;
  border:1px solid rgba(7,20,51,.25);
  border-radius:50%;
  right:-45px;
  top:-45px
}

.eyebrow{
  margin:0 0 3px;
  font-size:10px;
  letter-spacing:.18em;
  font-weight:800;
  color:#b9c7e7
}

.brand h1{
  margin:0;
  font-size:24px;
  line-height:1.1;
  letter-spacing:-.02em
}

.brand h1 em{
  font-style:normal;
  color:var(--yellow);
  font-weight:500
}

.header-actions{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0
}

.file-pill{
  max-width:360px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.18);
  padding:9px 12px;
  border-radius:999px;
  font-size:13px;
  display:flex;
  gap:7px;
  align-items:center
}

.ghost-btn{
  border:1px solid rgba(255,255,255,.3);
  background:transparent;
  color:#fff;
  border-radius:999px;
  padding:9px 13px;
  font-size:13px;
  font-weight:700
}

main{
  max-width:1280px;
  margin:0 auto;
  padding:10px 24px 28px
}

.hero{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:26px;
  align-items:stretch;
  color:#fff;
  padding:24px 0 28px
}

.hero-copy h2{
  font-size:52px;
  line-height:1;
  letter-spacing:-1px;
  margin:12px 0 16px;
  font-weight:800
}

.hero-copy h2 span{
  color:var(--yellow)
}

.kicker{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--yellow);
  font-weight:800;
  letter-spacing:.14em;
  font-size:12px;
  margin:0
}

.lede{
  max-width:520px;
  color:#c7d2ea;
  font-size:16px;
  line-height:1.6;
  margin:0
}

.mini-steps{
  display:flex;
  gap:0;
  margin-top:26px;
  border-top:1px solid rgba(255,255,255,.18);
  padding-top:16px;
  max-width:620px
}

.mini-steps span{
  flex:1;
  font-size:12px;
  color:#c7d2ea;
  line-height:1.4;
  padding-right:14px
}

.mini-steps b{
  display:block;
  color:#fff;
  font-size:16px;
  margin-bottom:3px
}

.dropzone{
  background:var(--yellow);
  color:#071433;
  border-radius:24px;
  padding:28px;
  text-align:center;
  cursor:pointer;
  border:3px dashed rgba(7,20,51,.3);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:268px
}

.dropzone.drag{
  background:#ffe066;
  transform:translateY(-2px)
}

.drop-icon{
  width:56px;
  height:56px;
  border-radius:50%;
  background:#071433;
  color:var(--yellow);
  display:grid;
  place-items:center;
  margin-bottom:14px
}

.dropzone strong{
  font-size:21px
}

.dropzone p{
  margin:6px 0 16px;
  font-size:14px
}

.choose{
  background:#071433;
  color:#fff;
  border-radius:999px;
  padding:11px 22px;
  font-weight:800
}

.dropzone small{
  display:block;
  margin-top:16px;
  color:rgba(7,20,51,.7);
  font-size:11px
}

.warning{
  margin:0 0 18px;
  background:#fff3ad;
  border:1px solid #efd43f;
  border-radius:14px;
  padding:13px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  color:#3c3100
}

.warning p{
  margin:0;
  flex:1;
  font-size:14px;
  line-height:1.4
}

.warning span{
  font-size:11px;
  font-weight:800;
  letter-spacing:.08em;
  text-align:right
}

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-bottom:16px
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:15px;
  box-shadow:0 4px 18px rgba(7,20,51,.05)
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700
}

.stat strong{
  display:block;
  font-size:32px;
  line-height:1.1;
  margin:6px 0 2px;
  letter-spacing:-.04em
}

.stat small{
  font-size:11px;
  color:#8a90a3
}

.stat.accent{
  background:#071433;
  color:#fff;
  border-color:#071433
}

.stat.accent span,.stat.accent small{
  color:#aebadd
}

.stat.accent strong{
  color:var(--yellow)
}

.workbench{
  background:var(--card);
  border-radius:22px;
  padding:18px;
  box-shadow:0 18px 50px rgba(7,20,51,.18)
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

.search-wrap{
  flex:1;
  min-width:230px;
  display:flex;
  align-items:center;
  gap:9px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:0 13px
}

.search-wrap input{
  border:0;
  outline:0;
  width:100%;
  padding:13px 0;
  background:transparent;
  font-size:14px
}

.clear-search{
  border:0;
  background:#eee;
  border-radius:50%;
  width:24px;
  height:24px;
  display:grid;
  place-items:center
}

.select-wrap{
  display:flex;
  align-items:center;
  gap:8px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:12px;
  padding:0 10px 0 13px;
  color:#333;
  font-size:13px;
  font-weight:700
}

.select-wrap select{
  border:0;
  outline:0;
  background:transparent;
  padding:13px 2px;
  -webkit-appearance:none;
     -moz-appearance:none;
          appearance:none;
  max-width:180px
}

.dedup-row{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  margin:14px 0 18px;
  padding:13px 14px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px
}

.check{
  display:flex;
  align-items:center;
  gap:9px;
  cursor:pointer
}

.check input{
  position:absolute;
  opacity:0;
  pointer-events:none
}

.check .box{
  width:22px;
  height:22px;
  border:2px solid #071433;
  border-radius:6px;
  display:grid;
  place-items:center;
  font-weight:900;
  background:#fff
}

.check input:checked{
  accent-color:var(--yellow)
}

.check b{
  font-size:13px;
  display:block
}

.check small{
  font-size:11px;
  color:var(--muted)
}

.visible-count{
  margin-left:auto;
  font-size:13px;
  color:var(--muted)
}

.visible-count strong{
  color:#071433;
  font-size:17px
}

.visible-count span{
  color:#111
}

.layout{
  display:grid;
  grid-template-columns:210px 1fr;
  gap:16px;
  align-items:start
}

.group-panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden
}

.panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 14px 10px
}

.panel-head h3{
  margin:0;
  font-size:15px
}

.text-btn{
  border:0;
  background:transparent;
  color:var(--blue);
  font-weight:800;
  font-size:12px
}

.group-list{
  display:flex;
  flex-direction:column
}

.group-item{
  border:0;
  border-top:1px solid #eee;
  background:#fff;
  text-align:left;
  padding:11px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:13px
}

.group-item:hover,.group-item.active{
  background:#fff5b8
}

.group-item.active{
  font-weight:800;
  box-shadow:inset 4px 0 0 var(--yellow)
}

.group-item b{
  background:#f1eee0;
  border-radius:999px;
  padding:3px 8px;
  font-size:11px
}

.panel-note{
  padding:14px;
  background:#071433;
  color:#fff;
  margin:10px;
  border-radius:10px;
  font-size:12px;
  line-height:1.5
}

.panel-note p{
  margin:0
}

.table-area{
  min-width:0
}

.table-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-bottom:10px
}

.table-actions div{
  display:flex;
  gap:7px;
  flex-wrap:wrap
}

.small-btn{
  border:1px solid #c9c6b8;
  background:#fff;
  border-radius:999px;
  padding:8px 11px;
  font-size:12px;
  font-weight:700;
  display:flex;
  align-items:center;
  gap:5px
}

.small-btn.danger{
  color:#8d1e1e
}

.result-line{
  margin:0;
  font-size:12px;
  color:#53607d;
  text-align:right;
  max-width:420px
}

.confirm-bar{
  background:#fff0f0;
  border:1px solid #f0b6b6;
  border-radius:12px;
  padding:12px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
  flex-wrap:wrap
}

.confirm-bar p{
  margin:0;
  font-size:13px
}

.danger-btn{
  background:#a91f1f;
  color:#fff;
  border:0;
  border-radius:999px;
  padding:9px 14px;
  font-weight:800
}

.confirm-bar .ghost-btn{
  color:#333;
  border-color:#aaa
}

.sr{
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
  white-space:nowrap
}

.empty-groups{
  margin:0;
  padding:10px 14px 14px;
  font-size:12px;
  color:var(--muted)
}

.table-scroll{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:640px;
  font-size:13px
}

thead th{
  text-align:left;
  padding:11px 12px;
  background:#f1eee0;
  color:#53607d;
  font-size:11px;
  letter-spacing:.06em;
  text-transform:uppercase;
  border-bottom:1px solid var(--line)
}

tbody td{
  padding:10px 12px;
  border-top:1px solid #eee;
  vertical-align:middle
}

tbody tr.selected{
  background:#fff8c2
}

.check-col{
  width:38px
}

.copy-col{
  width:110px
}

.row-check{
  display:grid;
  place-items:center;
  width:22px;
  height:22px;
  border:2px solid #071433;
  border-radius:6px;
  background:#fff;
  font-weight:900;
  font-size:13px;
  cursor:pointer
}

.row-check input{
  position:absolute;
  opacity:0;
  pointer-events:none
}

.channel-name{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:170px
}

.channel-name .initial{
  width:34px;
  height:34px;
  flex:0 0 34px;
  border-radius:50%;
  background:#071433;
  color:var(--yellow);
  display:grid;
  place-items:center;
  font-weight:800
}

.channel-name strong{
  display:block
}

.channel-name small{
  color:var(--muted);
  font-size:11px;
  word-break:break-word
}

.group-tag{
  display:inline-block;
  background:#eef1f9;
  border-radius:999px;
  padding:5px 9px;
  font-weight:700;
  white-space:nowrap
}

.logo{
  width:44px;
  height:30px;
  -o-object-fit:contain;
     object-fit:contain;
  background:#fff;
  border:1px solid #eee;
  border-radius:6px
}

.no-logo{
  color:#aaa
}

.url{
  display:block;
  max-width:260px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:#53607d;
  font-size:12px
}

.copy-btn{
  border:1px solid #c9c6b8;
  background:#fff;
  border-radius:999px;
  padding:7px 10px;
  font-size:12px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  gap:5px;
  white-space:nowrap
}

.empty-row{
  text-align:center;
  padding:28px 12px
}

.empty-row strong,.empty-row span{
  display:block;
  margin-bottom:6px
}

.empty-row .small-btn{
  margin:8px auto 0
}

.export-bar{
  margin-top:14px;
  background:#071433;
  color:#fff;
  border-radius:14px;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  flex-wrap:wrap
}

.export-bar p{
  margin:0
}

.export-bar strong{
  display:block
}

.export-bar span{
  font-size:12px;
  color:#c7d2ea
}

.export-btns{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}

.export-primary{
  background:var(--yellow);
  color:#071433;
  border:0;
  border-radius:999px;
  padding:11px 16px;
  font-weight:800;
  display:inline-flex;
  align-items:center;
  gap:7px
}

.export-secondary{
  background:transparent;
  color:#fff;
  border:1px solid rgba(255,255,255,.35);
  border-radius:999px;
  padding:11px 14px;
  font-weight:700;
  display:inline-flex;
  align-items:center;
  gap:7px
}

.export-note{
  margin:10px 2px 0;
  font-size:12px;
  color:var(--muted)
}

footer{
  max-width:1280px;
  margin:0 auto;
  padding:0 24px 24px;
  display:flex;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  color:#aebadd;
  font-size:12px
}

@media (max-width:900px){
  .hero{
    grid-template-columns:1fr
  }

  .hero-copy h2{
    font-size:40px
  }

  .stats{
    grid-template-columns:repeat(3,1fr)
  }

  .layout{
    grid-template-columns:1fr
  }

  .topbar{
    align-items:flex-start
  }

  .file-pill{
    max-width:220px
  }
}

@media (max-width:600px){
  .topbar,.export-bar,main,footer{
    padding-left:14px;
    padding-right:14px
  }

  .topbar{
    flex-wrap:wrap
  }

  .header-actions{
    width:100%;
    flex-wrap:wrap
  }

  .hero{
    padding-top:10px
  }

  .hero-copy h2{
    font-size:34px
  }

  .stats{
    grid-template-columns:repeat(2,1fr)
  }

  .stat strong{
    font-size:26px
  }

  .workbench{
    padding:12px
  }

  .search-wrap{
    min-width:0;
    width:100%
  }

  .select-wrap{
    flex:1
  }

  .export-btns,.export-primary,.export-secondary{
    width:100%;
    justify-content:center
  }

  .mini-steps{
    flex-wrap:wrap;
    gap:12px
  }

  .mini-steps span{
    flex-basis:45%
  }

  .warning span{
    display:none
  }
}

@media (prefers-color-scheme: dark){
  :root{
    --card:#111c36;
    --card-2:#162448;
    --ink:#eef1f8;
    --muted:#aab4cc;
    --line:#31406a
  }

  body{
    color:var(--ink)
  }

  .stat,.search-wrap,.select-wrap,.dedup-row,.group-panel,.group-item,.table-scroll,.small-btn,.copy-btn{
    background:#fff;
    color:#071433
  }

  .workbench{
    background:#101d38
  }

  .export-note{
    color:#aab4cc
  }
}
